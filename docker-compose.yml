services:
  auratest-ai:
    build:
      context: .
      # Konfigurace Firebase se zapéká do frontendu při buildu, ne za běhu.
      # Prázdná hodnota = použije se fallback z frontend/src/lib/firebase.js.
      args:
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        # Verze nasazení. Předává se ze skriptu nasazení; bez něj
        # aplikace napíše „verze neznámá" místo vymyšleného čísla.
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: auratest-ai
    restart: unless-stopped

    # Čas na dopsání rozdělaných běhů při vypnutí.
    #
    # Server po SIGTERM přepíše běhy, které zrovna drží, na „nedokončeno"
    # — bez toho by po každém nasazení zůstal záznam tvrdící „běží"
    # navždycky. Výchozích 10 vteřin je na několik zápisů do Firestore
    # těsných; server si sám hlídá rozpočet 5 s na zápisy a 10 s na celé
    # ukončení, takže 20 s mu dá rezervu a zároveň nasazení nezdrží.
    stop_grace_period: 20s

    # Bez stropu roste log kontejneru donekonečna a 50GB disk Oracle instance
    # se dá zaplnit rychleji, než by člověk čekal.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # Vázáno na loopback — server patří za reverzní proxy, ne přímo do sítě.
    # Pro přímé vystavení změňte na "3001:3001".
    ports:
      - "127.0.0.1:3001:3001"

    # Bez tohohle běžel kontejner bez Firebase credentials, Slack tokenů
    # a bez allowlistů (ALLOWED_LLM_HOSTS, ALLOWED_DB_HOSTS), takže se
    # dotčené funkce tiše vypnuly.
    env_file:
      - .env

    volumes:
      - ./screenshots:/app/screenshots
      - ./videos:/app/videos
      - ./generated-scripts:/app/generated-scripts
      # Neměnný záznam auditů. Bez svazku by ho smazal každý rebuild,
      # což je u důkazního materiálu ta nejhorší možná vlastnost.
      - ./ledger:/app/ledger
      # Servisní klíč se montuje read-only, do image se nekopíruje.
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro

    # Chromium potřebuje větší /dev/shm, jinak v kontejneru padá.
    shm_size: 1gb

    # Playwright umí sežrat celý host — bez stropu jeden zaseknutý běh
    # položí stroj.
    mem_limit: 2g
    cpus: 2.0

    # If using local Ollama, you might need this to access host.docker.internal
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

    environment:
      - NODE_ENV=production
      - PORT=3001
      # Kontejner běží za proxy — bez toho je req.ip vždy IP proxy
      # a rate limiting se klíčuje na jedinou hodnotu.
      - TRUST_PROXY=1
