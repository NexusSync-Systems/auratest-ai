<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AuraGuard">
  <!--
    Štít se zaškrtnutím — tentýž motiv, jaký má aplikace v hlavičce.

    Dřív byl favicon vložený jako data URI přímo v index.html a měl v sobě
    `stroke='%25238B5CF6'`. To je dvojitě zakódovaná mřížka: prohlížeč z ní
    dostal řetězec `%238B5CF6`, tedy neplatnou barvu, a nakreslil prázdno.
    Samostatný soubor tuhle třídu chyb odstraňuje úplně.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0b1120"/>
  <path d="M16 5.5 L25 9 v7.2c0 5.2-3.7 9.1-9 10.3-5.3-1.2-9-5.1-9-10.3V9z"
        fill="url(#g)"/>
  <path d="M11.8 16.2 L14.9 19.3 L20.5 13.2"
        fill="none" stroke="#ffffff" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
